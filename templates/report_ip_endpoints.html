<!DOCTYPE html>
<html data-report-accent="purple" lang="pt-BR">
<head>
  <script src="/static/theme.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IP Endpoints</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0e1a;--surface:#111728;--surface-2:#1a2236;--border:rgba(255,255,255,0.07);--text:#e8edf5;--text-muted:#6b7a99;--accent:#a78bfa;--accent-dim:rgba(167,139,250,0.12);--accent-blue:#3d8bff;--green:#34d399;--green-dim:rgba(52,211,153,0.1);--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(61,139,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(61,139,255,.03) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;}
    .page{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:40px 24px 80px;}
    .page-header{margin-bottom:32px;animation:fadeDown .5s ease both;}
    .breadcrumb-row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-bottom:16px;}
    .breadcrumb-row a{color:var(--accent-blue);text-decoration:none;}
    .breadcrumb-row a:hover{text-decoration:underline;}
    .breadcrumb-sep{opacity:.4;}
    h1{font-family:var(--mono);font-size:clamp(18px,3vw,28px);font-weight:700;letter-spacing:-.01em;}
    h1 span{color:var(--accent);}
    .header-sub{margin-top:6px;font-size:13px;font-weight:300;color:var(--text-muted);}
    .refresh-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:4px 10px;border-radius:100px;background:var(--green-dim);color:var(--green);border:1px solid rgba(52,211,153,.2);margin-top:10px;}
    .refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;animation:fadeUp .4s .1s ease both;}
    .search-wrap{position:relative;flex:1;min-width:200px;max-width:400px;}
    .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;}
    .search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 12px 9px 36px;transition:border-color .2s;outline:none;}
    .search-input::placeholder{color:var(--text-muted);}
    .search-input:focus{border-color:var(--accent);}
    .result-badge{font-family:var(--mono);font-size:11px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);padding:5px 12px;border-radius:100px;white-space:nowrap;}
    .result-badge b{color:var(--accent);}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border:none;text-decoration:none;transition:all .18s;}
    .btn-export{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(167,139,250,.3);}
    .btn-export:hover{background:rgba(167,139,250,.2);}
    .btn-back{background:var(--surface);color:var(--text-muted);border:1px solid var(--border);}
    .btn-back:hover{color:var(--text);border-color:rgba(255,255,255,.15);}
    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:fadeUp .4s .15s ease both;}
    .table-scroll{overflow-x:auto;max-height:62vh;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--text-muted);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
    thead th:hover{color:var(--text);}
    thead th .si{opacity:.3;margin-left:4px;font-size:9px;}
    thead th.asc .si::after{content:'▲';opacity:1;}
    thead th.desc .si::after{content:'▼';opacity:1;}
    thead th:not(.asc):not(.desc) .si::after{content:'⇅';}
    tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:var(--surface-2);}
    td{padding:11px 16px;color:var(--text-muted);vertical-align:middle;}
    td.ip-cell{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;}
    td.mac-cell{font-family:var(--mono);font-size:12px;color:var(--text);letter-spacing:.04em;white-space:nowrap;}
    td.path-cell{font-family:var(--mono);font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;cursor:default;}
    td.bd-cell{font-family:var(--mono);font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;cursor:default;}
    .empty-state{padding:60px 20px;text-align:center;color:var(--text-muted);font-size:14px;}
    .empty-state .icon{font-size:32px;margin-bottom:12px;opacity:.4;}
    .loading{padding:60px 20px;text-align:center;}
    .spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
    .loading-text{font-family:var(--mono);font-size:11px;color:var(--text-muted);letter-spacing:.1em;}
    .pagination-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap;gap:10px;}
    .page-info{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
    .page-btns{display:flex;gap:4px;}
    .page-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:7px;cursor:pointer;transition:all .15s;min-width:32px;text-align:center;}
    .page-btn:hover:not(:disabled){color:var(--text);border-color:rgba(255,255,255,.15);}
    .page-btn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(167,139,250,.3);}
    .page-btn:disabled{opacity:.3;cursor:not-allowed;}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    mark{background:rgba(167,139,250,.2);color:var(--accent);border-radius:2px;padding:0 1px;}
    @media(max-width:600px){.page{padding:24px 14px 60px;}.toolbar{flex-direction:column;align-items:stretch;}.search-wrap{max-width:100%;}}
  </style>
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div class="page">
  <div class="page-header">
    <div class="breadcrumb-row">
      <a href="/">Painel ACI</a><span class="breadcrumb-sep">/</span>
      <span>Endpoints</span><span class="breadcrumb-sep">/</span>
      <span>IP Endpoints</span>
    </div>
    <h1>Endpoints — <span>Por IP</span></h1>
    <p class="header-sub">Endpoints com endereço IP aprendido no fabric — IP, MAC, localização e BD</p>
    <div class="refresh-pill"><span class="refresh-dot"></span>ATUALIZAÇÃO AUTOMÁTICA A CADA 60s</div>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" class="search-input" placeholder="Buscar IP, MAC, path, BD, descrição…"/>
    </div>
    <span class="result-badge" id="resultBadge"><b>—</b> endpoints</span>
    <div style="display:flex;gap:8px;margin-left:auto">
      <a class="btn btn-export" href="/export_csv/ip_endpoints">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar CSV
      </a>
      <a class="btn btn-back" href="/">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Voltar
      </a>
    </div>
  </div>
  <div class="table-wrap">
    <div class="table-scroll">
      <table id="mainTable">
        <thead><tr>
          <th data-key="ip">IP<span class="si"></span></th>
          <th data-key="mac">MAC<span class="si"></span></th>
          <th data-key="fabric_path">Localização<span class="si"></span></th>
          <th data-key="bd">BD / Tenant<span class="si"></span></th>
          <th data-key="description">Descrição<span class="si"></span></th>
        </tr></thead>
        <tbody id="tableBody">
          <tr><td colspan="5"><div class="loading"><div class="spinner"></div><div class="loading-text">CONSULTANDO APIC…</div></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination-row">
      <span class="page-info" id="pageInfo">—</span>
      <div class="page-btns" id="pageBtns"></div>
    </div>
  </div>
</div>
<script src="/static/report-tools.js"></script>
<script>
  const PER_PAGE=20;let allData=[],filteredData=[],currentPage=1,sortKey=null,sortDir='asc';
  async function fetchData(){try{const r=await fetchReport('/api/ip_endpoints');if(!r.ok)throw new Error('HTTP '+r.status);allData=await r.json();if(allData.error)throw new Error(allData.error);applyFilter();}catch(e){document.getElementById('tableBody').innerHTML=`<tr><td colspan="5"><div class="empty-state"><div class="icon">⚠</div>Erro: ${e.message}</div></td></tr>`;}}
  function applyFilter(){const q=document.getElementById('searchInput').value.toLowerCase().trim();filteredData=q?allData.filter(matchesReportFilters).filter(r=>Object.values(r).some(v=>v&&String(v).toLowerCase().includes(q))):allData.filter(matchesReportFilters);if(sortKey){filteredData.sort((a,b)=>{if(sortKey==='ip'){const pa=a.ip.split('.').map(n=>+n),pb=b.ip.split('.').map(n=>+n);for(let i=0;i<4;i++){if(pa[i]!==pb[i])return sortDir==='asc'?pa[i]-pb[i]:pb[i]-pa[i];}return 0;}const va=String(a[sortKey]??'').toLowerCase(),vb=String(b[sortKey]??'').toLowerCase();return sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);});}currentPage=1;render();}
  function escHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function hl(t,q){if(!q||!t)return escHtml(t);const s=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return escHtml(String(t)).replace(new RegExp(s,'gi'),m=>`<mark>${m}</mark>`);}
  function render(){const q=document.getElementById('searchInput').value.toLowerCase().trim(),total=filteredData.length,pages=Math.max(1,Math.ceil(total/PER_PAGE));currentPage=Math.min(currentPage,pages);const start=(currentPage-1)*PER_PAGE,slice=filteredData.slice(start,start+PER_PAGE);document.getElementById('resultBadge').innerHTML=`<b>${total}</b> endpoint${total!==1?'s':''}`;const tbody=document.getElementById('tableBody');tbody.innerHTML=slice.length===0?`<tr><td colspan="5"><div class="empty-state"><div class="icon">🔍</div>Nenhum endpoint encontrado</div></td></tr>`:slice.map(r=>`<tr><td class="ip-cell">${hl(r.ip,q)}</td><td class="mac-cell">${hl(r.mac,q)||'<span style="opacity:.3">—</span>'}</td><td class="path-cell" title="${escHtml(r.fabric_path)}">${hl(r.fabric_path,q)||'<span style="opacity:.3">—</span>'}</td><td class="bd-cell" title="${escHtml(r.bd)}">${hl(r.bd,q)||'<span style="opacity:.3">—</span>'}<br><small>${hl(r.endpoint_dn,q)}</small></td><td>${hl(r.description,q)||'<span style="opacity:.3">—</span>'}</td></tr>`).join('');document.getElementById('pageInfo').textContent=total===0?'0 endpoints':`${start+1}–${Math.min(start+PER_PAGE,total)} de ${total}`;renderPagination(pages);}
  function renderPagination(pages){const wrap=document.getElementById('pageBtns');if(pages<=1){wrap.innerHTML='';return;}const range=buildRange(currentPage,pages);wrap.innerHTML=[`<button class="page-btn" id="btnPrev" ${currentPage===1?'disabled':''}>‹</button>`,...range.map(p=>p==='…'?`<span class="page-btn" style="cursor:default">…</span>`:`<button class="page-btn${p===currentPage?' active':''}" data-p="${p}">${p}</button>`),`<button class="page-btn" id="btnNext" ${currentPage===pages?'disabled':''}>›</button>`].join('');wrap.querySelector('#btnPrev').onclick=()=>{currentPage--;render();};wrap.querySelector('#btnNext').onclick=()=>{currentPage++;render();};wrap.querySelectorAll('[data-p]').forEach(b=>{b.onclick=()=>{currentPage=+b.dataset.p;render();};});}
  function buildRange(c,t){if(t<=7)return Array.from({length:t},(_,i)=>i+1);if(c<=4)return[1,2,3,4,5,'…',t];if(c>=t-3)return[1,'…',t-4,t-3,t-2,t-1,t];return[1,'…',c-1,c,c+1,'…',t];}
  document.querySelectorAll('thead th[data-key]').forEach(th=>{th.onclick=()=>{const key=th.dataset.key;sortDir=sortKey===key&&sortDir==='asc'?'desc':'asc';sortKey=key;document.querySelectorAll('thead th').forEach(h=>h.classList.remove('asc','desc'));th.classList.add(sortDir);applyFilter();};});
  document.getElementById('searchInput').addEventListener('input',()=>applyFilter());
  setInterval(fetchData,60000);
  fetchData();
</script>
</body>
</html>
