<!DOCTYPE html>
<html data-report-accent="blue" lang="pt-BR">
<head>
  <script src="/static/theme.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interfaces Inativas — DOWN</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:         #0a0e1a;
      --surface:    #111728;
      --surface-2:  #1a2236;
      --border:     rgba(255,255,255,0.07);
      --text:       #e8edf5;
      --text-muted: #6b7a99;
      --accent:     #3d8bff;
      --accent-dim: rgba(61,139,255,0.12);
      --red:        #f87171;
      --red-dim:    rgba(248,113,113,0.1);
      --yellow:     #fbbf24;
      --yellow-dim: rgba(251,191,36,0.1);
      --mono:       'Space Mono', monospace;
      --sans:       'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(61,139,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,139,255,.03) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none; z-index: 0;
    }
    .page { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 40px 24px 80px; }

    /* ── HEADER ── */
    .page-header { margin-bottom: 32px; animation: fadeDown .5s ease both; }
    .breadcrumb-row {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-bottom: 16px;
    }
    .breadcrumb-row a { color: var(--accent); text-decoration: none; }
    .breadcrumb-row a:hover { text-decoration: underline; }
    .breadcrumb-sep { opacity: .4; }
    h1 { font-family: var(--mono); font-size: clamp(18px,3vw,28px); font-weight: 700; letter-spacing: -.01em; }
    h1 span { color: var(--red); }
    .header-sub { margin-top: 6px; font-size: 13px; font-weight: 300; color: var(--text-muted); }

    /* ── TOOLBAR ── */
    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; animation: fadeUp .4s .1s ease both; }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .search-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-family: var(--sans);
      font-size: 13px; padding: 9px 12px 9px 36px; transition: border-color .2s; outline: none;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--red); }

    .result-badge {
      font-family: var(--mono); font-size: 11px; color: var(--text-muted);
      background: var(--surface); border: 1px solid var(--border);
      padding: 5px 12px; border-radius: 100px; white-space: nowrap;
    }
    .result-badge b { color: var(--red); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 10px; font-family: var(--sans);
      font-size: 13px; font-weight: 500; cursor: pointer; border: none;
      text-decoration: none; transition: all .18s;
    }
    .btn-export { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,.3); }
    .btn-export:hover { background: rgba(248,113,113,.18); }
    .btn-back { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-back:hover { color: var(--text); border-color: rgba(255,255,255,.15); }

    /* ── TABLE ── */
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; animation: fadeUp .4s .15s ease both; }
    .table-scroll { overflow-x: auto; max-height: 62vh; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      position: sticky; top: 0; z-index: 2;
      background: var(--surface-2); color: var(--text-muted);
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border);
      white-space: nowrap; cursor: pointer; user-select: none;
    }
    thead th:hover { color: var(--text); }
    thead th .sort-icon { opacity: .3; margin-left: 4px; font-size: 9px; }
    thead th.asc  .sort-icon::after { content: '▲'; opacity: 1; }
    thead th.desc .sort-icon::after { content: '▼'; opacity: 1; }
    thead th:not(.asc):not(.desc) .sort-icon::after { content: '⇅'; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    td { padding: 11px 16px; color: var(--text-muted); vertical-align: middle; }
    td.mono { font-family: var(--mono); font-size: 12px; color: var(--text); white-space: nowrap; }
    td.dn-cell {
      font-family: var(--mono); font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 320px; cursor: default;
    }
    td.vlan-cell { font-family: var(--mono); font-size: 12px; color: var(--yellow); white-space: nowrap; }

    /* badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; padding: 3px 10px; border-radius: 100px; letter-spacing: .04em; white-space: nowrap; }
    .badge::before { content: '●'; font-size: 7px; }
    .badge-red    { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(248,113,113,.2); }
    .badge-yellow { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(251,191,36,.2); }
    .badge-muted  { background: var(--surface-2);  color: var(--text-muted); border: 1px solid var(--border); }

    .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }
    .empty-state .icon { font-size: 32px; margin-bottom: 12px; opacity: .4; }
    .loading { padding: 60px 20px; text-align: center; }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
    .loading-text { font-family: var(--mono); font-size: 11px; color: var(--text-muted); letter-spacing: .1em; }

    /* ── PAGINATION ── */
    .pagination-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
    .page-info { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
    .page-btns { display: flex; gap: 4px; }
    .page-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); font-family: var(--mono); font-size: 11px; padding: 5px 10px; border-radius: 7px; cursor: pointer; transition: all .15s; min-width: 32px; text-align: center; }
    .page-btn:hover:not(:disabled) { color: var(--text); border-color: rgba(255,255,255,.15); }
    .page-btn.active { background: var(--red-dim); color: var(--red); border-color: rgba(248,113,113,.3); }
    .page-btn:disabled { opacity: .3; cursor: not-allowed; }

    @keyframes fadeDown { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(14px)}  to{opacity:1;transform:translateY(0)} }
    @keyframes spin     { to{transform:rotate(360deg)} }
    mark { background: rgba(248,113,113,.15); color: var(--red); border-radius: 2px; padding: 0 1px; }

    @media (max-width: 600px) {
      .page { padding: 24px 14px 60px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .search-wrap { max-width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div class="page">

  <div class="page-header">
    <div class="breadcrumb-row">
      <a href="/">Painel ACI</a>
      <span class="breadcrumb-sep">/</span>
      <span>Interfaces</span>
      <span class="breadcrumb-sep">/</span>
      <span>Interfaces Inativas (DOWN)</span>
    </div>
    <h1>Interfaces — <span>Inativas (DOWN)</span></h1>
    <p class="header-sub">Interfaces com estado operacional DOWN no fabric</p>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" class="search-input" placeholder="Buscar VLAN, MAC, DN…"/>
    </div>

    <span class="result-badge" id="resultBadge"><b>—</b> interfaces</span>

    <div style="display:flex;gap:8px;margin-left:auto">
      <a class="btn btn-export" href="/export_csv/down">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar CSV
      </a>
      <a class="btn btn-back" href="/">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Voltar
      </a>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-scroll">
      <table id="mainTable">
        <thead>
          <tr>
            <th data-key="access_vlan">Access VLAN<span class="sort-icon"></span></th>
            <th data-key="backplane_mac">Backplane MAC<span class="sort-icon"></span></th>
            <th data-key="cfg_access_vlan">Cfg Access VLAN<span class="sort-icon"></span></th>
            <th data-key="dn">DN<span class="sort-icon"></span></th>
            <th data-key="oper_st">Status<span class="sort-icon"></span></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5">
            <div class="loading">
              <div class="spinner"></div>
              <div class="loading-text">CONSULTANDO APIC…</div>
            </div>
          </td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination-row">
      <span class="page-info" id="pageInfo">—</span>
      <div class="page-btns" id="pageBtns"></div>
    </div>
  </div>

</div>
<script src="/static/report-tools.js"></script>
<script>
  const PER_PAGE = 20;
  let allData = [], filteredData = [], currentPage = 1, sortKey = null, sortDir = 'asc';

  async function fetchData() {
    try {
      const r = await fetchReport('/api/interfaces/down');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      allData = await r.json();
      if (allData.error) throw new Error(allData.error);
      filteredData = allData.filter(matchesReportFilters);
      render();
    } catch (e) {
      document.getElementById('tableBody').innerHTML =
        `<tr><td colspan="5"><div class="empty-state"><div class="icon">⚠</div>Erro ao carregar dados: ${e.message}</div></td></tr>`;
    }
  }

  function applyFilter() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    filteredData = q
      ? allData.filter(matchesReportFilters).filter(r => Object.values(r).some(v => v && String(v).toLowerCase().includes(q)))
      : allData.filter(matchesReportFilters);

    if (sortKey) {
      filteredData.sort((a, b) => {
        const va = String(a[sortKey] ?? '').toLowerCase();
        const vb = String(b[sortKey] ?? '').toLowerCase();
        return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
      });
    }
    currentPage = 1;
    render();
  }

  function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function hl(text, q) {
    if (!q || !text) return escHtml(text);
    const safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escHtml(String(text)).replace(new RegExp(safe, 'gi'), m => `<mark>${m}</mark>`);
  }

  function vlanBadge(v) {
    if (!v || v === 'unknown' || v === '0') return `<span style="opacity:.3">—</span>`;
    return `<span class="badge badge-yellow">${escHtml(v)}</span>`;
  }
  function operStBadge(v) {
    return `<span class="badge badge-red">▼ ${escHtml((v || 'down').toUpperCase())}</span>`;
  }

  function render() {
    const q     = document.getElementById('searchInput').value.toLowerCase().trim();
    const total = filteredData.length;
    const pages = Math.max(1, Math.ceil(total / PER_PAGE));
    currentPage = Math.min(currentPage, pages);
    const start = (currentPage - 1) * PER_PAGE;
    const slice = filteredData.slice(start, start + PER_PAGE);

    document.getElementById('resultBadge').innerHTML = `<b>${total}</b> interface${total !== 1 ? 's' : ''}`;

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = slice.length === 0
      ? `<tr><td colspan="5"><div class="empty-state"><div class="icon">🔍</div>Nenhum resultado encontrado</div></td></tr>`
      : slice.map(r => `
          <tr>
            <td class="vlan-cell">${hl(r.access_vlan, q) || '<span style="opacity:.3">—</span>'}</td>
            <td class="mono">${hl(r.backplane_mac, q) || '<span style="opacity:.3">—</span>'}</td>
            <td class="vlan-cell">${hl(r.cfg_access_vlan, q) || '<span style="opacity:.3">—</span>'}</td>
            <td class="dn-cell" title="${escHtml(r.dn)}">${hl(r.dn, q)}</td>
            <td>${operStBadge(r.oper_st)}</td>
          </tr>`).join('');

    document.getElementById('pageInfo').textContent =
      total === 0 ? '0 interfaces' : `${start + 1}–${Math.min(start + PER_PAGE, total)} de ${total}`;
    renderPagination(pages);
  }

  function renderPagination(pages) {
    const wrap = document.getElementById('pageBtns');
    if (pages <= 1) { wrap.innerHTML = ''; return; }
    const range = buildPageRange(currentPage, pages);
    wrap.innerHTML = [
      `<button class="page-btn" id="btnPrev" ${currentPage===1?'disabled':''}>‹</button>`,
      ...range.map(p => p === '…'
        ? `<span class="page-btn" style="cursor:default">…</span>`
        : `<button class="page-btn${p===currentPage?' active':''}" data-p="${p}">${p}</button>`),
      `<button class="page-btn" id="btnNext" ${currentPage===pages?'disabled':''}>›</button>`,
    ].join('');
    wrap.querySelector('#btnPrev').onclick = () => { currentPage--; render(); };
    wrap.querySelector('#btnNext').onclick = () => { currentPage++; render(); };
    wrap.querySelectorAll('[data-p]').forEach(btn => {
      btn.onclick = () => { currentPage = +btn.dataset.p; render(); };
    });
  }

  function buildPageRange(cur, total) {
    if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
    if (cur <= 4)   return [1,2,3,4,5,'…',total];
    if (cur >= total - 3) return [1,'…',total-4,total-3,total-2,total-1,total];
    return [1,'…',cur-1,cur,cur+1,'…',total];
  }

  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.key;
      sortDir = sortKey === key && sortDir === 'asc' ? 'desc' : 'asc';
      sortKey = key;
      document.querySelectorAll('thead th').forEach(h => h.classList.remove('asc','desc'));
      th.classList.add(sortDir);
      applyFilter();
    };
  });

  document.getElementById('searchInput').addEventListener('input', () => applyFilter());
  fetchData();
</script>
</body>
</html>
